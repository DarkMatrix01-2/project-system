<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study rooms · StackZen</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="rooms">
  <nav class="nav">
    <a class="logo" href="../index.html">StackZen</a>
    <a class="nav-link" href="../index.html" data-page="home">Dashboard</a>
    <a class="nav-link" href="tasks.html" data-page="tasks">Tasks</a>
    <a class="nav-link" href="rooms.html" data-page="rooms">Study rooms</a>
    <a class="nav-link" href="resources.html" data-page="resources">Resources</a>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle light or dark mode">◐</button>
  </nav>

  <main>
    <h2>Study rooms</h2>
    <p class="note">Chat is a simulation that saves messages in this browser only. Live multi-user chat and calls need a server, which the lab rules don't allow.</p>

    <div class="card chat">
      <ul class="room-list" id="room-list">
        <li class="active">#calculus</li>
        <li>#data-structures</li>
        <li>#networking</li>
      </ul>
      <div>
        <div class="messages" id="messages"></div>
        <form class="form-row" id="chat-form">
          <input class="grow" id="message-input" placeholder="Message the room" aria-label="Message">
          <button class="btn btn-secondary">Send</button>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/rooms.js"></script>
</body>
</html>
